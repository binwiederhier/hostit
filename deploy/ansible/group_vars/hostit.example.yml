---
# Copy to group_vars/hostit.yml and edit -- NON-secret settings only. Unset keys
# fall back to roles/hostit/defaults/main.yml. Every secret (admin token, client
# secrets, AWS/API keys, cluster certs) goes in group_vars/hostit_vault.yml instead
# -- see group_vars/hostit_vault.example.yml for the full list.

# --- Required ---

# Served at <app>.<hostit_domain>; needs wildcard DNS (*.apps.example.com and
# apps.example.com both pointing here).
hostit_domain: "apps.example.com"

# Release to install (https://github.com/binwiederhier/hostit/releases).
hostit_version: "0.35.0"

# --- Recommended ---

# Web dashboard via Google OAuth (redirect https://apps.example.com/auth/callback);
# omit both to run token-only.
# hostit_control_google_client_id: "..."
# hostit_control_google_client_secret: "..."      # -> Vault
# hostit_control_admin_emails:
#   - you@example.com

# --- Optional ---

# Wildcard TLS via Route 53 (DNS-01) so new apps serve TLS instantly.
# hostit_control_aws_access_key_id: "..."
# hostit_control_aws_secret_key: "..."            # -> Vault
# hostit_control_aws_hosted_zone_id: "..."

# Built-in AI assistant: a metered API key and/or a Claude Pro/Max token.
# hostit_control_anthropic_api_key: "sk-ant-..."  # -> Vault
# hostit_control_claude_api_token: "..."   # -> Vault (claude setup-token)

# Multi-node SSH: each remote node advertises its own SSH hostname (host_vars).
# hostit_node_ssh_host: "node2.ssh.apps.example.com"
# Optional single-hostname relay so `ssh <app>@apps.example.com` reaches any app
# on any node. The control host is the frontend (via sudo-gated helpers in the
# control package), so it needs no node of its own -- a [control, proxy] box relays.
# hostit_ssh_relay: true

# Internal CIDRs apps/fetches may reach past the default block (metadata + private
# space). Whitelist NARROWLY.
# hostit_outbound_allow_private_cidrs:
#   - 10.20.0.0/24
