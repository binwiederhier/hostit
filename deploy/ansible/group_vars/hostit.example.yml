---
# Copy to group_vars/hostit.yml and edit. Unset keys fall back to
# roles/hostit/defaults/main.yml. Keep secrets in an Ansible Vault file
# (ansible-vault create group_vars/hostit_vault.yml; deploy with --ask-vault-pass).

# --- Required ---

# Served at <app>.<hostit_domain>; needs wildcard DNS (*.apps.example.com and
# apps.example.com both pointing here).
hostit_domain: "apps.example.com"

# Admin REST API token (openssl rand -hex 24); keep it in Vault.
hostit_admin_token: "CHANGE-ME"

# Release to install (https://github.com/binwiederhier/hostit/releases).
hostit_version: "0.34.0"

# --- Recommended ---

# Web dashboard via Google OAuth (redirect https://apps.example.com/auth/callback);
# omit both to run token-only.
# hostit_google_client_id: "..."
# hostit_google_client_secret: "..."      # -> Vault
# hostit_admin_emails:
#   - you@example.com

# --- Optional ---

# Wildcard TLS via Route 53 (DNS-01) so new apps serve TLS instantly.
# hostit_aws_access_key_id: "..."
# hostit_aws_secret_key: "..."            # -> Vault
# hostit_aws_hosted_zone_id: "..."

# Built-in AI assistant: a metered API key and/or a Claude Pro/Max token.
# hostit_anthropic_api_key: "sk-ant-..."  # -> Vault
# hostit_claude_code_oauth_token: "..."   # -> Vault (claude setup-token)

# Multi-node SSH: each remote node advertises its own SSH hostname (host_vars).
# hostit_ssh_host: "node2.ssh.apps.example.com"
# Optional single-hostname relay so `ssh <app>@apps.example.com` reaches any node.
# hostit_ssh_relay: true

# Internal CIDRs apps/fetches may reach past the default block (metadata + private
# space). Whitelist NARROWLY.
# hostit_outbound_allow_private_cidrs:
#   - 10.20.0.0/24
