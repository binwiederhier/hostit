---

# ============================================================================
# Common -- every host, whatever role it runs
# ============================================================================

# Which hostit release to install (from the public GitHub releases). Every host
# stages its own component .debs from this version.
hostit_version: "0.35.0"

# Apps are served at <app>.<hostit_domain>; needs wildcard DNS for the domain
# and the domain itself pointing at the control host.
hostit_domain: "apps.example.com"

# Admin REST API bearer token (openssl rand -hex 24); set it from a vault/secret.
hostit_admin_token: ""

# Install locally built .debs from this dir instead of downloading (the version
# is read off the files); hostit_deb_version pins one build in a mixed directory.
hostit_deb_dir: ""
hostit_deb_version: ""

# The Unix group every app user belongs to (sshd strips forwarding from it, and
# the relay sudoers grant is scoped to it). Fixed name; matches app.AppsGroup.
hostit_apps_group: "hostit-apps"

# One outbound allow-list applied everywhere hostit reaches out on an account's
# behalf: control's fetches, the preview container, and each node's app firewall.
# The default block covers cloud metadata and all private space. Whitelist NARROWLY.
hostit_outbound_allow_private_cidrs: []

# --- Topology ---
# Which components run on THIS host. The single-box default runs all three; a
# remote node sets [node], a control-only box [control, proxy]. See tasks/main.yml.
hostit_components: [control, node, proxy]

# Run hostit-proxy as a separate TLS data plane in front of control (control then
# serves plain HTTP for it). Run the machine half as its own hostit-node daemon.
hostit_split_proxy: "{{ 'proxy' in hostit_components }}"
hostit_split_node: false

# Optional single-hostname SSH relay so `ssh <app>@<domain>` reaches any node.
hostit_ssh_relay: false

# ============================================================================
# Control plane -- optional features rendered into control.yml
# ============================================================================

# ACME contact email (control manages the certificates).
hostit_control_letsencrypt_email: ""

# Web dashboard via Google OAuth (redirect https://<domain>/auth/callback);
# empty runs token-only (REST API + CLI still work).
hostit_control_google_client_id: ""
hostit_control_google_client_secret: ""

# Cookie signing key; generated by the daemon when empty.
hostit_control_session_key: ""

# Emails auto-approved as admins on first login.
hostit_control_admin_emails: []

# OAuth client per connection provider offered (slack-bot, discord, github, ...);
# a provider with no entry is not offered. Set real values in secrets/<env>.yml.
hostit_control_connection_clients: {}

# Built-in AI assistant; each key's presence is the switch, both empty disables it.
hostit_control_anthropic_api_key: ""              # metered Anthropic API
hostit_control_claude_api_token: ""               # additionally offers Claude.ai (claude setup-token)

# App card previews: "live" iframe, "screenshot" (headless chrome), or "off".
hostit_control_app_preview: "live"

# Wildcard TLS via Route 53 (DNS-01); empty = per-app cert on first request.
hostit_control_aws_region: "us-east-1"
hostit_control_aws_access_key_id: ""
hostit_control_aws_secret_key: ""
hostit_control_aws_hosted_zone_id: ""

# Control's plain-HTTP address for the proxy in front (loopback), and the mTLS
# listener for members on OTHER hosts (empty on a single box -- socket only).
hostit_control_listen_http: "127.0.0.1:2910"
hostit_control_listen_cluster_tls: ""
# Optional Prometheus /metrics listener (empty = off); bind internal-only.
hostit_control_listen_metrics_http: ""

# ============================================================================
# Node -- app containers, btrfs, the machine half
# ============================================================================

# App homes on a btrfs loopback image (snapshots + hard quotas); preflight requires it.
hostit_node_apps_dir: /var/lib/hostit/node/apps
hostit_node_apps_img: /var/lib/hostit/node/apps.btrfs
hostit_node_apps_mount_unit: var-lib-hostit-node-apps.mount

# Static crun for idmapped --rootfs (crun >= 1.29; the distro crun is too old).
hostit_node_crun_version: "1.29.1"
hostit_node_crun_sha256: "0a5ea25cafe618bbfbf1c747871155063619f18025ccdd8ad648c97633f35d57"
hostit_node_crun_path: /usr/local/lib/hostit-crun

# Hostname control advertises for `ssh <app>@...` on this node; a REMOTE node must
# set its own reachable address or its apps' SSH lands on control.
hostit_node_ssh_host: ""

# Where a remote node publishes app ports, and who may reach them (the proxies).
hostit_node_apps_bind_address: ""
hostit_node_apps_allowed_addresses: []

# Optional Prometheus /metrics listener (empty = off); bind internal-only.
hostit_node_listen_metrics_http: ""

# A remote node's cluster identity files (populated from secrets on a remote node).
hostit_node_cert_file: /etc/hostit/node/endpoint.crt
hostit_node_key_file: /etc/hostit/node/endpoint.key
hostit_node_ca_file: /etc/hostit/node/ca.crt

# --- Computed (do not set) ---
hostit_node_remote: "{{ ('node' in hostit_components) and ('control' not in hostit_components) }}"
hostit_node_id: "{{ 'local' if not hostit_node_remote else inventory_hostname }}"
hostit_node_control_url: "{{ 'unix:/run/hostit/control/cluster.sock' if not hostit_node_remote else hostit_control_node }}"

# ============================================================================
# Proxy -- the public TLS data plane
# ============================================================================

hostit_proxy_listen_metrics_http: ""
# A remote proxy's cluster identity files (populated from secrets on a remote proxy).
hostit_proxy_cert_file: /etc/hostit/proxy/endpoint.crt
hostit_proxy_key_file: /etc/hostit/proxy/endpoint.key
hostit_proxy_ca_file: /etc/hostit/proxy/ca.crt

# --- Computed (do not set) ---
hostit_proxy_remote: "{{ ('proxy' in hostit_components) and ('control' not in hostit_components) }}"
hostit_proxy_id: "{{ 'local' if not hostit_proxy_remote else inventory_hostname }}"
hostit_proxy_cluster_url: "{{ 'unix:/run/hostit/control/cluster.sock' if not hostit_proxy_remote else hostit_control_node }}"

# ============================================================================
# Cluster mTLS (multi-machine only) -- provided as SECRETS, hostit does not mint
# them. Issue from your own CA (openssl recipe in node.yml.example):
#   hostit_cluster_ca_cert: |          the CA cert (PEM)
#   hostit_cluster_certs:              one entry per member that dials over mTLS
#     control:   { cert: "<PEM>", key: "<PEM>" }
#     <node-id>: { cert: "<PEM>", key: "<PEM>" }
# A single-box install needs none of this (members use the /run/hostit socket).
# ============================================================================

# The inventory host running control (where a remote member dials in), and its
# mTLS address for members. Empty/loopback on a single box.
hostit_control_host: ""
hostit_control_node: "127.0.0.1:2930"
hostit_cluster_ca_cert: ""
hostit_cluster_certs: {}

# Packages this host installs: the components here plus the node package wherever
# apps run (it carries the `hostit` CLI, app unit, login shell and sudoers).
hostit_runs_apps: "{{ ('node' in hostit_components) or ('control' in hostit_components and not (hostit_split_node | default(false))) }}"
hostit_packages: "{{ (hostit_components + (['node'] if hostit_runs_apps else [])) | unique }}"
