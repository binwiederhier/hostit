---

# Which hostit release to install, from the public GitHub releases:
#   https://github.com/binwiederhier/hostit/releases
hostit_version: "0.33.0"

# hostit ships one package per component. All three go on a single-box install:
# the node package is what carries the `hostit` CLI, the per-app systemd unit,
# the app login shell and the sudoers grant, even where its daemon stays off.
hostit_packages: [hostit-control, hostit-node, hostit-proxy]
hostit_arch: amd64

# Development override: install locally built .debs instead of downloading.
#   (cd hostit && make release-snapshot)
# Empty means download hostit_version from GitHub.
hostit_deb_dir: ""
hostit_deb_version: ""

# Where hostit-control listens for the proxy in front of it. Loopback: the
# proxy shares this host, and nothing else should reach the plain-HTTP port.
hostit_control_http: "127.0.0.1:2910"

# Where members (the node, the proxy) dial control. Loopback on a single host;
# a routable address once nodes live on other machines.

# REQUIRED. Apps are served at <app>.<hostit_domain>. Needs wildcard DNS: both
# *.apps.example.com AND apps.example.com must point at this host.
hostit_domain: "apps.example.com"

# REQUIRED. Bearer token for the admin REST API (full access). Generate with
# `openssl rand -hex 24` and set it from a vault/secret, NOT in plain vars.
hostit_admin_token: ""

# Optional ACME contact email.
hostit_letsencrypt_email: ""

# Web dashboard via Google OAuth. Empty runs token-only, with no web login (the
# REST API and CLI still work). Redirect URI: https://<hostit_domain>/auth/callback
hostit_google_client_id: ""
hostit_google_client_secret: ""
hostit_session_key: ""          # cookie signing key; generated by the daemon if empty
hostit_admin_emails: []         # these emails become active admins on first login

# Built-in AI assistant (in-browser agent). Each credential's presence is the whole
# switch; leave both empty to disable the assistant.
hostit_anthropic_api_key: ""              # metered Anthropic API models
hostit_claude_code_oauth_token: ""        # additionally offers Claude.ai (claude setup-token)

# Optional wildcard TLS via Route 53 (DNS-01), so a brand-new app serves TLS at
# once. Empty means per-app certificates issued on first request (no AWS needed).
hostit_aws_region: "us-east-1"
hostit_aws_access_key_id: ""
hostit_aws_secret_key: ""
hostit_aws_hosted_zone_id: ""

# REQUIRED: put app homes on a btrfs loopback so hostit can snapshot them and
# enforce hard disk quotas. hostit refuses to start unless apps-dir is btrfs, so
# leave this on (this role sets it up). Turn it off only if apps-dir is already
# btrfs by other means.
hostit_apps_dir: /var/lib/hostit/apps
hostit_apps_img: /var/lib/hostit/apps.btrfs
hostit_apps_mount_unit: var-lib-hostit-apps.mount

# The Unix group every app user belongs to; sshd uses it to strip forwarding from
# app logins (must match app.AppsGroup in the hostit source).
hostit_apps_group: "hostit-apps"

# Multi-node SSH (optional). On a MULTI-NODE deployment each remote node must
# advertise its own reachable SSH hostname, so `ssh <app>@...` lands on the node
# that runs the app; unset falls back to hostit_domain (right for a single host).
hostit_ssh_host: ""
# Optional single-hostname SSH relay gateway on the control host: lets
# `ssh <app>@<hostit_domain>` reach an app on ANY node through the system sshd
# (no daemon of its own, no extra port). Off by default -- the per-node hostnames
# above work without it. EXPERIMENTAL; see docs/features/ssh-access.md.
hostit_ssh_relay: false

# Static crun for idmapped rootfs mounts: hostit requires crun >= 1.29 (Ubuntu
# 24.04 ships 1.14.1, which cannot idmap-mount a --rootfs, and hostit's preflight
# refuses to start on it). The official static release binary is installed next
# to the distro package and podman is pointed at it via containers.conf.d; the
# distro crun stays as a fallback. Checksum from the release's .asc/sha256.
hostit_crun_version: "1.29.1"
hostit_crun_sha256: "0a5ea25cafe618bbfbf1c747871155063619f18025ccdd8ad648c97633f35d57"
hostit_crun_path: /usr/local/lib/hostit-crun

# Optional Prometheus /metrics listeners (empty = off). The three components
# share a single host, so give each its own port, and bind to an internal
# interface -- /metrics is unauthenticated.
hostit_control_listen_metrics: ""   # e.g. "10.0.0.1:9110"
hostit_node_listen_metrics: ""      # e.g. "10.0.0.1:9111"
hostit_proxy_listen_metrics: ""     # e.g. "10.0.0.1:9112"
