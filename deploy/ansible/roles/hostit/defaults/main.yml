---

# Which hostit release to install (from the public GitHub releases).
hostit_version: "0.34.0"

# hostit ships one .deb per component; a single-box install runs all three. The
# node package also carries the `hostit` CLI, app unit, login shell and sudoers.
hostit_packages: [hostit-control, hostit-node, hostit-proxy]
hostit_arch: amd64

# Install locally built .debs (make release-snapshot) instead of downloading.
hostit_deb_dir: ""
hostit_deb_version: ""

# Where control serves plain HTTP for the proxy in front of it (loopback).
hostit_control_http: "127.0.0.1:2910"

# REQUIRED. Apps are served at <app>.<hostit_domain>; needs wildcard DNS for both
# *.apps.example.com and apps.example.com pointing here.
hostit_domain: "apps.example.com"

# REQUIRED. Admin REST API token (openssl rand -hex 24); set it from a vault.
hostit_admin_token: ""

# Optional ACME contact email.
hostit_letsencrypt_email: ""

# Web dashboard via Google OAuth (redirect https://<hostit_domain>/auth/callback);
# empty runs token-only.
hostit_google_client_id: ""
hostit_google_client_secret: ""
hostit_session_key: ""          # cookie signing key; generated by the daemon if empty
hostit_admin_emails: []         # these emails become admins on first login

# Built-in AI assistant; each credential's presence is the switch, both empty disables it.
hostit_anthropic_api_key: ""              # metered Anthropic API
hostit_claude_code_oauth_token: ""        # additionally offers Claude.ai (claude setup-token)

# Optional wildcard TLS via Route 53 (DNS-01); empty = per-app cert on first request.
hostit_aws_region: "us-east-1"
hostit_aws_access_key_id: ""
hostit_aws_secret_key: ""
hostit_aws_hosted_zone_id: ""

# App homes on a btrfs loopback (snapshots + hard quotas); node preflight requires it.
hostit_apps_dir: /var/lib/hostit/apps
hostit_apps_img: /var/lib/hostit/apps.btrfs
hostit_apps_mount_unit: var-lib-hostit-apps.mount

# The Unix group every app user belongs to (sshd strips forwarding from it).
hostit_apps_group: "hostit-apps"

# Hostname for `ssh <app>@...` on this node (multi-node); unset = hostit_domain.
hostit_ssh_host: ""
# Optional single-hostname SSH relay so `ssh <app>@<domain>` reaches any node.
hostit_ssh_relay: false

# Static crun for idmapped --rootfs (crun >= 1.29; the distro crun is too old).
hostit_crun_version: "1.29.1"
hostit_crun_sha256: "0a5ea25cafe618bbfbf1c747871155063619f18025ccdd8ad648c97633f35d57"
hostit_crun_path: /usr/local/lib/hostit-crun

# Optional Prometheus /metrics per component (empty = off); bind internal-only.
hostit_control_listen_metrics: ""   # e.g. "10.0.0.1:9110"
hostit_node_listen_metrics: ""      # e.g. "10.0.0.1:9111"
hostit_proxy_listen_metrics: ""     # e.g. "10.0.0.1:9112"
