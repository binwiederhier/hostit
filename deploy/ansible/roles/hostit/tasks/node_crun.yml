---

# hostit runs each app on an idmapped --rootfs, which needs crun >= 1.29 (newer
# than most distros ship); its preflight refuses to start otherwise. Install the
# static release binary and point podman at it, keeping the distro crun as fallback.

- name: Install static crun {{ hostit_crun_version }} (idmapped rootfs support)
  ansible.builtin.get_url:
    url: "https://github.com/containers/crun/releases/download/{{ hostit_crun_version }}/crun-{{ hostit_crun_version }}-linux-amd64"
    dest: "{{ hostit_crun_path }}"
    checksum: "sha256:{{ hostit_crun_sha256 }}"
    mode: "0755"
    owner: root
    group: root

- name: Create containers.conf.d
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Point podman at the static crun
  ansible.builtin.copy:
    dest: /etc/containers/containers.conf.d/50-hostit-crun.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (hostit role).
      [engine]
      runtime = "crun"
      [engine.runtimes]
      crun = ["{{ hostit_crun_path }}", "/usr/bin/crun"]
