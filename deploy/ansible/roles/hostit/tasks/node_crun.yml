---

# hostit runs each app on an idmapped --rootfs, which needs crun >= 1.29 (newer
# than Ubuntu 24.04 ships); its preflight refuses to start otherwise. Install the
# static release binary and point podman at it, keeping the distro crun as fallback.

- name: Install static crun {{ hostit_node_crun_version }} (idmapped rootfs support)
  get_url:
    url: "https://github.com/containers/crun/releases/download/{{ hostit_node_crun_version }}/crun-{{ hostit_node_crun_version }}-linux-amd64"
    dest: "{{ hostit_node_crun_path }}"
    checksum: "sha256:{{ hostit_node_crun_sha256 }}"
    mode: "0755"
    owner: root
    group: root

- name: Create containers.conf.d
  file:
    path: /etc/containers/containers.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Point podman at the static crun
  copy:
    dest: /etc/containers/containers.conf.d/50-hostit-crun.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (hostit role).
      [engine]
      runtime = "crun"
      [engine.runtimes]
      crun = ["{{ hostit_node_crun_path }}", "/usr/bin/crun"]
