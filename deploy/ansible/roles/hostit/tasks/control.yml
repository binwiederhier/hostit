---

# The control plane: registry, web app and REST API. Runs as the unprivileged
# hostit-control user (baked into the unit); the deb creates /etc/hostit/control.

# sqlite3 is only for the off-box hot-backup of control's hostit.db.
- name: Install sqlite3 (off-box hot-backup of hostit.db)
  apt:
    name: sqlite3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the hostit-control package
  command: "dpkg -i --force-confold /tmp/hostit-control.deb"
  when: hostit_debs_changed | default(false)
  notify: restart hostit-control

# control's mTLS identity for members on OTHER machines, from secrets (hostit
# does not mint them). A single-box install has no remote listener and skips it.
- name: Install control's endpoint cert, key and CA (only with a remote listener)
  copy:
    content: "{{ item.content }}"
    dest: "/etc/hostit/control/{{ item.dest }}"
    owner: hostit-control
    group: hostit-control
    mode: "0600"
  loop:
    - { content: "{{ hostit_cluster_certs.control.cert }}", dest: "endpoint.crt" }
    - { content: "{{ hostit_cluster_certs.control.key }}", dest: "endpoint.key" }
    - { content: "{{ hostit_cluster_ca_cert }}", dest: "ca.crt" }
  loop_control:
    label: "{{ item.dest }}"
  when: (hostit_control_listen_cluster_tls | default('')) | length > 0
  no_log: true
  notify: restart hostit-control

- name: Install /etc/hostit/control/control.yml
  template:
    src: control.yml.j2
    dest: /etc/hostit/control/control.yml
    owner: hostit-control
    group: hostit-control
    mode: 0600
  notify:
    - restart hostit-control
    - restart hostit-node

# The optional SSH relay gateway lives on the control host (its colocated node is
# the frontend, and the node self-generates the relay key), so it is just a sudo
# grant. Its own drop-in, not the packaged sudoers, whose config|noreplace would
# skip it on upgrade.
- name: Grant hostit-apps sudo to the relay helper
  copy:
    dest: /etc/sudoers.d/hostit-relay
    owner: root
    group: root
    mode: "0440"
    content: |
      # Managed by ansible (hostit relay) -- do not edit on the host.
      # Like hostit-enter, hostit-relay derives the app from SUDO_UID and ignores
      # its arguments, so a member can only relay as their own app.
      Defaults!/usr/lib/hostit/bin/hostit-relay !requiretty
      %{{ hostit_apps_group }} ALL=(root) NOPASSWD: /usr/lib/hostit/bin/hostit-relay
    validate: "visudo -cf %s"
  when: hostit_ssh_relay | default(false)

- name: Enable and start hostit-control
  systemd:
    name: hostit-control
    enabled: yes
    state: started
    daemon_reload: yes
