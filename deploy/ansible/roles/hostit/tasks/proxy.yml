---

# The public data plane: terminates TLS on :443 and serves each app from the
# routing table control pushes it, so apps keep serving while control and the
# node restart. It runs as the unprivileged hostit-proxy user (baked into the
# shipped unit, which owns /var/lib/hostit/proxy via StateDirectory) and dials
# the colocated control over the /run/hostit socket.

# dpkg -i (not the apt module): same-version rebuilds are common while iterating,
# and apt would treat them as already installed. --force-confold keeps managed
# configs instead of prompting on upgrade. The proxy package has no dependencies
# of its own; its postinst creates the hostit-proxy user that owns the config
# file written below.
- name: Install the hostit-proxy package
  ansible.builtin.command: "dpkg -i --force-confold /tmp/hostit-proxy_{{ hostit_deb_release }}_linux_{{ hostit_arch }}.deb"
  when: hostit_debs_changed | default(false)
  notify: restart hostit-proxy

- name: Install /etc/hostit/proxy/proxy.yml
  ansible.builtin.template:
    src: proxy.yml.j2
    dest: /etc/hostit/proxy/proxy.yml
    owner: hostit-proxy
    group: hostit-proxy
    mode: "0600"
  notify: restart hostit-proxy

# Do not put the proxy on :443 before control can hand it routes and certs: an
# empty-cache window would serve nothing. Wait for control's member socket first.
- name: Wait for control's member socket
  ansible.builtin.wait_for:
    path: /run/hostit/control/cluster.sock
    timeout: 300

- name: Enable and start hostit-proxy
  ansible.builtin.systemd:
    name: hostit-proxy
    enabled: true
    state: started
    daemon_reload: true
