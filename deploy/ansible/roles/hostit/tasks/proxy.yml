---

# The public data plane: terminates TLS on :443 and serves each app from the
# routing table control pushes it, so apps keep serving while control and the
# node restart. Runs as the unprivileged hostit-proxy user (baked into the unit)
# and dials the colocated control over the /run/hostit socket.

# dpkg -i (not apt) so same-version rebuilds reinstall; --force-confold keeps the
# managed config. The proxy deb has no deps; its postinst makes the user that
# owns the config below.
- name: Install the hostit-proxy package
  ansible.builtin.command: "dpkg -i --force-confold /tmp/hostit-proxy_{{ hostit_deb_release }}_linux_{{ hostit_arch }}.deb"
  when: hostit_debs_changed | default(false)
  notify: restart hostit-proxy

- name: Install /etc/hostit/proxy/proxy.yml
  ansible.builtin.template:
    src: proxy.yml.j2
    dest: /etc/hostit/proxy/proxy.yml
    owner: hostit-proxy
    group: hostit-proxy
    mode: "0600"
  notify: restart hostit-proxy

# Wait for control's socket so the proxy does not take :443 before control can
# hand it routes and certs (an empty-cache window would serve nothing).
- name: Wait for control's member socket
  ansible.builtin.wait_for:
    path: /run/hostit/control/cluster.sock
    timeout: 300

- name: Enable and start hostit-proxy
  ansible.builtin.systemd:
    name: hostit-proxy
    enabled: true
    state: started
    daemon_reload: true
