---

# Stage the component .debs to /tmp; the install lives in each component file
# (the node deb needs the container runtime installed first). A fresh box pulls
# from the public GitHub release; hostit_deb_dir installs local builds.

# One filename per package, shared by the download, copy and per-component install.
- name: Name the package files
  ansible.builtin.set_fact:
    hostit_deb_release: "{{ hostit_deb_dir | length > 0 and hostit_deb_version or 'v' + hostit_version }}"

- name: Stage the package paths
  ansible.builtin.set_fact:
    hostit_deb_files: >-
      {{ hostit_packages | map('regex_replace', '$', '_' + hostit_deb_release + '_linux_' + hostit_arch + '.deb') | list }}

- name: Download the hostit {{ hostit_version }} release packages
  ansible.builtin.get_url:
    url: "https://github.com/binwiederhier/hostit/releases/download/v{{ hostit_version }}/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: "0644"
  loop: "{{ hostit_deb_files }}"
  register: hostit_deb_remote
  when: hostit_deb_dir | length == 0

- name: Copy locally built hostit packages (development override)
  ansible.builtin.copy:
    src: "{{ hostit_deb_dir }}/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: "0644"
  loop: "{{ hostit_deb_files }}"
  register: hostit_deb_copy
  when: hostit_deb_dir | length > 0

# The .debs are versioned together; each component reinstalls only when they change.
- name: Note whether the staged packages changed
  ansible.builtin.set_fact:
    hostit_debs_changed: "{{ (hostit_deb_remote is changed) or (hostit_deb_copy is changed) }}"
