---

# Stage each host's component .debs to /tmp; the install lives in each component
# file (the node deb needs the container runtime installed first). A fresh box
# pulls from the public GitHub release; hostit_deb_dir installs local builds.

- name: Download the hostit {{ hostit_version }} packages this host runs
  get_url:
    url: "https://github.com/binwiederhier/hostit/releases/download/v{{ hostit_version }}/hostit-{{ item }}_{{ hostit_version }}_linux_amd64.deb"
    dest: "/tmp/hostit-{{ item }}.deb"
    mode: 0644
  loop: "{{ hostit_packages }}"
  register: hostit_deb_remote
  when: hostit_deb_dir | length == 0

# Version is read off the built .debs, so a local deploy needs no -e override.
- name: Detect the version of the locally built packages
  set_fact:
    hostit_deb_version_local: "{{ lookup('fileglob', hostit_deb_dir ~ '/hostit-control_*_linux_amd64.deb', wantlist=True) | first | basename
                                  | regex_replace('^hostit-control_(.*)_linux_amd64\\.deb$', '\\1') }}"
  when: hostit_deb_dir | length > 0 and (hostit_deb_version | length == 0)

- name: Use the configured local package version
  set_fact:
    hostit_deb_version_local: "{{ hostit_deb_version }}"
  when: hostit_deb_dir | length > 0 and (hostit_deb_version | length > 0)

- name: Copy the locally built packages this host runs (development override)
  copy:
    src: "{{ (hostit_deb_dir ~ '/hostit-' ~ item ~ '_' ~ hostit_deb_version_local ~ '_linux_amd64.deb') }}"
    dest: "/tmp/hostit-{{ item }}.deb"
    mode: 0644
  loop: "{{ hostit_packages }}"
  register: hostit_deb_copy
  when: hostit_deb_dir | length > 0

# The .debs are versioned together; each component reinstalls only when they change.
- name: Note whether the staged packages changed
  set_fact:
    hostit_debs_changed: "{{ (hostit_deb_remote is changed) or (hostit_deb_copy is changed) }}"
