---
# SSH relay gateway on the frontend (the colocated control host). The node now
# generates its own relay key on startup (/var/lib/hostit/node/relay_key) and
# reports the pubkey to control, which adds it to remote apps' authorized_keys --
# so there is no ssh-keygen here. This only grants hostit-apps sudo to the relay
# helper; sshd needs NO change (it runs the sftp Subsystem through the login
# shell, so the relay branch relays sftp automatically, and the app-user
# forwarding restrictions are already applied by the sshd hardening in node.yml).

# The relay grant lives in its own drop-in (only on relay hosts), not the
# packaged hostit sudoers, whose config|noreplace would skip it on upgrade.
- name: Grant hostit-apps sudo to the relay helper
  copy:
    dest: /etc/sudoers.d/hostit-relay
    owner: root
    group: root
    mode: "0440"
    content: |
      # Managed by ansible (hostit relay) -- do not edit on the host.
      # The relay's privileged inner hop: like hostit-enter it derives the app
      # from SUDO_UID and ignores its arguments, so a hostit-apps member can only
      # relay as their own app.
      Defaults!/usr/lib/hostit/bin/hostit-relay !requiretty
      %{{ hostit_apps_group }} ALL=(root) NOPASSWD: /usr/lib/hostit/bin/hostit-relay
    validate: "visudo -cf %s"
