---

# The machine half: app containers, their unix users, btrfs subvolumes and port
# rules -- always root, dialing the colocated control over the /run/hostit socket.
# Everything a node needs (and nothing a control- or proxy-only host would) lives
# here: the container runtime, crun, the app-homes btrfs and the sshd hardening.

# The container runtime: podman (as root), uidmap for id-mapped filesystems,
# passt/slirp4netns for per-app netns, nftables for the port rules.
- name: Install podman and container dependencies
  ansible.builtin.apt:
    name:
      - podman
      - uidmap
      - passt
      - slirp4netns
      - dbus-user-session
      - nftables
      - openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600

# dpkg -i (not apt) so same-version rebuilds reinstall; --force-confold keeps the
# managed config. After the runtime, which the node deb depends on; its postinst
# makes the hostit-node user + login shell.
- name: Install the hostit-node package
  ansible.builtin.command: "dpkg -i --force-confold /tmp/hostit-node_{{ hostit_deb_release }}_linux_{{ hostit_arch }}.deb"
  when: hostit_debs_changed | default(false)
  notify: restart hostit-node

# Static crun for idmapped --rootfs (the distro crun is too old for hostit).
- name: Set up crun for idmapped rootfs
  ansible.builtin.import_tasks: node_crun.yml

# App homes must be btrfs (snapshots/quotas are core); node preflight enforces it.
- name: Set up the app-homes btrfs
  ansible.builtin.import_tasks: node_btrfs.yml
  tags: [btrfs]

# Stop an app login from tunnelling into the host (metadata, host-local services).
- name: Harden sshd for app users
  ansible.builtin.template:
    src: sshd-hostit-apps.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hostit-apps.conf
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: restart ssh

- name: Install /etc/hostit/node/node.yml
  ansible.builtin.template:
    src: node.yml.j2
    dest: /etc/hostit/node/node.yml
    owner: root
    group: root
    mode: "0600"
  notify: restart hostit-node

- name: Enable and start hostit-node
  ansible.builtin.systemd:
    name: hostit-node
    enabled: true
    state: started
    daemon_reload: true
