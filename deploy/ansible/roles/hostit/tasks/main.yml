---

# hostit -- self-hosted mini-app platform. hostit_components decides which of
# control/node/proxy run here, so one role fits every topology. Orchestration
# only: the debs provide the users, /run dirs and unprivileged units.

- name: Stage the hostit component packages
  import_tasks: packages.yml
  tags: [hostit]

- name: Configure and run the control plane
  import_tasks: control.yml
  when: "'control' in hostit_components"
  tags: [hostit]

- name: Configure and run the node (app containers + host prep)
  import_tasks: node.yml
  when: "'node' in hostit_components"
  tags: [hostit, btrfs]

- name: Configure and run the proxy
  import_tasks: proxy.yml
  when: "'proxy' in hostit_components"
  tags: [hostit]

# A component dropped from hostit_components must stop, not serve stale config.
- name: Stop the components this host does not run
  systemd:
    name: "hostit-{{ item }}"
    enabled: no
    state: stopped
  loop: [control, node, proxy]
  when: item not in hostit_components
  failed_when: false
  tags: [hostit]
