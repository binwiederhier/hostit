---

# hostit -- self-hosted mini-app platform. Installs the component packages from
# a public GitHub release (or locally built .debs), writes their configs, optionally puts
# app homes on btrfs, hardens sshd for app logins, and starts the service.
#
# hostit runs as a root daemon and drives podman as root, giving each app its own
# uid map, network namespace and nftables port rules. uidmap is needed for the
# id-mapped container filesystems.
- name: Install podman and container dependencies
  ansible.builtin.apt:
    name:
      - podman
      - uidmap
      - passt
      - slirp4netns
      - dbus-user-session
      - nftables
      - sqlite3
    state: present
    update_cache: true
    cache_valid_time: 3600

# hostit runs each app container on an idmapped --rootfs (the app's root-owned
# btrfs subvolume mapped through the container's uid map), which needs a newer
# crun than most distributions ship. hostit's preflight refuses to start on an
# old one (podman >= 4.3, crun >= 1.29), resolving crun through podman info --
# so this containers.conf drop-in is exactly what it validates.
- name: Install static crun {{ hostit_crun_version }} (idmapped rootfs support)
  ansible.builtin.get_url:
    url: "https://github.com/containers/crun/releases/download/{{ hostit_crun_version }}/crun-{{ hostit_crun_version }}-linux-amd64"
    dest: "{{ hostit_crun_path }}"
    checksum: "sha256:{{ hostit_crun_sha256 }}"
    mode: "0755"
    owner: root
    group: root

- name: Create containers.conf.d
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Point podman at the static crun
  ansible.builtin.copy:
    dest: /etc/containers/containers.conf.d/50-hostit-crun.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (hostit role). hostit needs crun >= 1.29 for
      # idmapped --rootfs mounts; the distro crun stays as a fallback.
      [engine]
      runtime = "crun"
      [engine.runtimes]
      crun = ["{{ hostit_crun_path }}", "/usr/bin/crun"]

# The pre-split package check below reads the package list.
- name: Gather installed packages
  ansible.builtin.package_facts:
    manager: auto

- name: Fail early if required variables are unset
  ansible.builtin.assert:
    that:
      - hostit_domain | length > 0
      - hostit_admin_token | length > 0
    fail_msg: "Set hostit_domain and hostit_admin_token (see group_vars/hostit.example.yml)."

# hostit ships as three packages, one per component. This role installs all
# three on one machine: hostit-control (the brain, which also does the machine
# work here), hostit-proxy (the data plane on :443), and hostit-node -- whose
# daemon stays disabled in this shape, but whose package carries the `hostit`
# CLI that is bind-mounted into every app container, the per-app systemd unit,
# the app login shell and the sudoers grant.
# One name for each package's file, used by the download, the copy and the
# install below, so the three can never disagree about what they are handling.
- name: Name the package files
  ansible.builtin.set_fact:
    hostit_deb_release: "{{ hostit_deb_dir | length > 0 and hostit_deb_version or 'v' + hostit_version }}"

- name: Stage the package paths
  ansible.builtin.set_fact:
    hostit_deb_files: >-
      {{ hostit_packages | map('regex_replace', '$', '_' + hostit_deb_release + '_linux_' + hostit_arch + '.deb') | list }}

- name: Download the hostit {{ hostit_version }} release packages
  ansible.builtin.get_url:
    url: "https://github.com/binwiederhier/hostit/releases/download/v{{ hostit_version }}/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: "0644"
  loop: "{{ hostit_deb_files }}"
  register: hostit_deb_remote
  when: hostit_deb_dir | length == 0

- name: Copy locally built hostit packages (development override)
  ansible.builtin.copy:
    src: "{{ hostit_deb_dir }}/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: "0644"
  loop: "{{ hostit_deb_files }}"
  register: hostit_deb_copy
  when: hostit_deb_dir | length > 0

# The three packages Conflict/Replace the pre-split "hostit" package, so an
# upgrade from before the split removes it here. Its config and data stay.
- name: Remove the pre-split hostit package
  ansible.builtin.command: dpkg --remove --force-depends hostit
  register: hostit_remove_monolith
  changed_when: hostit_remove_monolith.rc == 0
  failed_when: false
  when: "'hostit' in ansible_facts.packages"

# dpkg -i (not the apt module): same-version rebuilds are common while iterating,
# and apt would treat them as already installed. --force-confold keeps the
# managed configs instead of prompting on upgrade. All three in one call, since
# they replace a common package and dpkg wants them configured together.
- name: Install the hostit packages
  ansible.builtin.command: >-
    dpkg -i --force-confold
    {{ hostit_deb_files | map('regex_replace', '^', '/tmp/') | join(' ') }}
  when: >-
    (hostit_deb_remote is changed) or (hostit_deb_copy is changed)
  notify:
    - restart hostit-control
    - restart hostit-proxy

- name: Create the component config directories
  ansible.builtin.file:
    path: "/etc/hostit/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [control, proxy]

- name: Install /etc/hostit/control/control.yml
  ansible.builtin.template:
    src: control.yml.j2
    dest: /etc/hostit/control/control.yml
    owner: root
    group: root
    mode: "0600"
  notify: restart hostit-control

- name: Install /etc/hostit/proxy/proxy.yml
  ansible.builtin.template:
    src: proxy.yml.j2
    dest: /etc/hostit/proxy/proxy.yml
    owner: root
    group: root
    mode: "0600"
  notify: restart hostit-proxy

# Optionally move app homes onto a btrfs loopback (snapshots + hard quotas).
- name: Set up btrfs app homes
  ansible.builtin.import_tasks: btrfs.yml
  when: hostit_btrfs | default(false)
  tags: [btrfs]

# An app login must not become a tunnel into the host: without this, a tenant can
# forward to the cloud metadata service or probe host-local services.
- name: Harden sshd for app users
  ansible.builtin.template:
    src: sshd-hostit-apps.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hostit-apps.conf
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: restart ssh

# hostit-node is deliberately NOT enabled: control does the machine work in
# this shape, and running both would give one host two owners.
- name: Enable and start hostit-control
  ansible.builtin.systemd:
    name: hostit-control
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start hostit-proxy
  ansible.builtin.systemd:
    name: hostit-proxy
    enabled: true
    state: started
    daemon_reload: true
