---

# hostit -- self-hosted mini-app platform. This role installs all three
# components on ONE machine and runs them as three processes that talk over the
# /run/hostit unix sockets: control (the registry, web app and API), node (the
# app containers and host machinery, as root) and proxy (TLS on :443).
#
# main.yml is orchestration only: fail fast on missing config, install the
# component packages, then hand off to each component's own task file. control
# comes first because node and proxy dial the socket it opens; proxy last because
# it waits for control before taking :443. To split these across machines instead
# of one box, see the multi-node notes in group_vars/hostit.example.yml.

- name: Fail early if required variables are unset
  ansible.builtin.assert:
    that:
      - hostit_domain | length > 0
      - hostit_admin_token | length > 0
    fail_msg: "Set hostit_domain and hostit_admin_token (see group_vars/hostit.example.yml)."

- name: Install the component packages
  ansible.builtin.import_tasks: packages.yml

- name: Configure and run the control plane
  ansible.builtin.import_tasks: control.yml

- name: Configure and run the node (app containers + host prep)
  ansible.builtin.import_tasks: node.yml

- name: Configure and run the proxy
  ansible.builtin.import_tasks: proxy.yml
