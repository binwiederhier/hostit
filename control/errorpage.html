<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root { color-scheme: light dark;
    --fg: #14181d; --muted: #5b6672; --bg: #f6f7f9; --card: #fff; --line: #e3e7ec;
    --accent: #10b981; --err: #ef4444; --mark: #14181d; --markfg: #4ade80; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8ecf1; --muted: #97a3b0; --bg: #14181d; --card: #1b2027; --line: #2a313a; --mark: #0d1117; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--bg); color: var(--fg);
         font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
          border-radius: 16px; padding: 32px; text-align: center; }
  .badge { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700;
           letter-spacing: 0.06em; text-transform: uppercase; color: var(--err);
           border: 1px solid color-mix(in srgb, var(--err) 35%, var(--line));
           background: color-mix(in srgb, var(--err) 10%, transparent);
           border-radius: 999px; padding: 4px 12px; }
  h1 { margin: 18px 0 0; font-size: 24px; letter-spacing: -0.02em; text-wrap: balance; }
  p { margin: 12px auto 0; color: var(--muted); font-size: 14.5px; max-width: 36ch; }
  .foot { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--fg); text-decoration: none; }
  .mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px;
          background: var(--mark); color: var(--markfg);
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; }
  .wm { font-weight: 650; font-size: 16px; letter-spacing: -0.01em; }
  .what { margin: 10px auto 0; max-width: 34ch; font-size: 13px; }
  .what a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
<div class="card">
  <span class="badge">Error {{.Code}}</span>
  <h1>{{.Headline}}</h1>
  <p>{{.Message}}</p>
  <div class="foot">
    <a class="brand" href="{{.Home}}"><span class="mark">&gt;_</span><span class="wm">hostit</span></a>
    <p class="what">hostit hosts small web apps, each with a subdomain, HTTPS and SSH. <a href="{{.Home}}">Start one</a>.</p>
  </div>
</div>
