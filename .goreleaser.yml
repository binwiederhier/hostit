version: 2
before:
  hooks:
    - go mod download
    - go mod tidy
builds:
  - id: hostit_linux_amd64
    binary: hostit
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    goos: [ linux ]
    goarch: [ amd64 ]
  - id: hostit_linux_arm64
    binary: hostit
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    goos: [ linux ]
    goarch: [ arm64 ]
  - id: hostit_proxy_linux_amd64
    binary: hostit-proxy
    main: ./hostit-proxy-bin
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    goos: [ linux ]
    goarch: [ amd64 ]
  - id: hostit_control_linux_amd64
    binary: hostit-control
    main: ./hostit-control-bin
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    goos: [ linux ]
    goarch: [ amd64 ]
  - id: hostit_control_linux_arm64
    binary: hostit-control
    main: ./hostit-control-bin
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    goos: [ linux ]
    goarch: [ arm64 ]
  - id: hostit_node_linux_amd64
    binary: hostit-node
    main: ./hostit-node-bin
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    goos: [ linux ]
    goarch: [ amd64 ]
  - id: hostit_node_linux_arm64
    binary: hostit-node
    main: ./hostit-node-bin
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    goos: [ linux ]
    goarch: [ arm64 ]
  - id: hostit_proxy_linux_arm64
    binary: hostit-proxy
    main: ./hostit-proxy-bin
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    goos: [ linux ]
    goarch: [ arm64 ]
nfpms:
  - package_name: hostit
    homepage: https://github.com/binwiederhier/hostit
    maintainer: Philipp C. Heckel <phil@heckel.io>
    description: Self-hosted mini-app platform with SSH access, subdomains and TLS
    license: Apache 2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    dependencies:
      - openssh-server
      - podman
      - uidmap
      - slirp4netns
      - nftables
      - dbus-user-session
    recommends:
      - passt
    contents:
      - src: server.yml.example
        dst: /etc/hostit/server.yml.example
      - src: hostit-control.service
        dst: /lib/systemd/system/hostit-control.service
      - src: hostit-proxy.service
        dst: /lib/systemd/system/hostit-proxy.service
      - src: hostit-node.service
        dst: /lib/systemd/system/hostit-node.service
      - src: proxy.yml.example
        dst: /etc/hostit/proxy.yml.example
      - src: hostit-shell
        dst: /usr/bin/hostit-shell
        file_info:
          mode: 0755
      - src: hostit-enter
        dst: /usr/bin/hostit-enter
        file_info:
          mode: 0755
      - src: hostit-app@.service
        dst: /lib/systemd/system/hostit-app@.service
      - src: hostit.sudoers
        dst: /etc/sudoers.d/hostit
        type: "config|noreplace"
        file_info:
          mode: 0440
    scripts:
      postinstall: "scripts/postinst.sh"
      postremove: "scripts/postrm.sh"
archives:
  - id: hostit_linux
    ids:
      - hostit_linux_amd64
      - hostit_linux_arm64
      - hostit_proxy_linux_amd64
      - hostit_proxy_linux_arm64
      - hostit_control_linux_amd64
      - hostit_control_linux_arm64
      - hostit_node_linux_amd64
      - hostit_node_linux_arm64
    wrap_in_directory: true
    files:
      - README.md
      - server.yml.example
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
