<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hostit app</title>
<style>
  :root { color-scheme: light dark;
    --fg: #14181d; --muted: #5b6672; --bg: #f6f7f9; --card: #fff; --line: #e3e7ec;
    --accent: #10b981; --mark: #14181d; --markfg: #4ade80; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8ecf1; --muted: #97a3b0; --bg: #14181d; --card: #1b2027; --line: #2a313a; --mark: #0d1117; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--bg); color: var(--fg);
         font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
          border-radius: 16px; padding: 32px; text-align: center; }
  .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
           letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent);
           border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
           background: color-mix(in srgb, var(--accent) 10%, transparent);
           border-radius: 999px; padding: 4px 12px; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  h1 { margin: 18px 0 0; font-size: 24px; letter-spacing: -0.02em; }
  p { margin: 12px auto 0; color: var(--muted); font-size: 14.5px; max-width: 34ch; }
  .foot { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--fg); }
  .mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px;
          background: var(--mark); color: var(--markfg);
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; }
  .wm { font-weight: 650; font-size: 16px; letter-spacing: -0.01em; }
</style>
<div class="card">
  <span class="badge"><span class="dot"></span>Ready</span>
  <h1>Nothing here yet</h1>
  <p>This app is live and waiting. Its owner is about to build something here.</p>
  <div class="foot">
    <span class="brand"><span class="mark">&gt;_</span><span class="wm">hostit</span></span>
  </div>
</div>
