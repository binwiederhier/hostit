# hostit-control runs as this unprivileged system user so a compromised proxy or
# app cannot read control's registry, cluster CA, connection tokens or session
# key. The systemd-journal membership lets the admin "logs" view read control's
# own journal. Created by the deb (systemd-sysusers), not by Ansible.
u hostit-control - "hostit control" - /usr/sbin/nologin
m hostit-control systemd-journal
